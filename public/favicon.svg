<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- TuneAtLife Favicon - Optimized for small sizes -->
  <defs>
    <!-- Gradient for the pulse wave -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D7D7D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A9B9B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D7D7D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for better visibility -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#2D7D7D" stroke-width="2"/>
  
  <!-- Simplified "T" for Tune -->
  <text x="12" y="28" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2D7D7D">T</text>
  
  <!-- Central pulse wave - the key brand element -->
  <path d="M 16 32 L 20 32 L 22 24 L 24 40 L 26 20 L 28 44 L 30 32 L 34 32 L 36 28 L 38 36 L 40 24 L 42 40 L 44 32 L 48 32" 
        stroke="url(#pulseGradient)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Simplified "L" for Life -->
  <text x="50" y="28" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2D7D7D">L</text>
  
  <!-- Subtle glow effect for the pulse -->
  <path d="M 16 32 L 20 32 L 22 24 L 24 40 L 26 20 L 28 44 L 30 32 L 34 32 L 36 28 L 38 36 L 40 24 L 42 40 L 44 32 L 48 32" 
        stroke="#4A9B9B" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.2"/>
</svg>